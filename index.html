<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokedex</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="./assets/icons/pokeball-icon.svg"
    />

    <link rel="stylesheet" href="./assets/css/standard.css" />
    <link rel="stylesheet" href="./assets/css/variable.css" />
    <link rel="stylesheet" href="./assets/css/fonts.css" />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.cdnfonts.com/css/pokemon-solid"
      rel="stylesheet"
    />

    <script src="./assets/javascript/template.js"></script>
    <script src="./script.js" defer></script>
  </head>
  <body>
    <main class="main">
      <header class="header-home">
        <section class="container">
          <div class="logo-wrapper">
            <img src="./assets/icons/pokeball-icon.svg" alt="Pokeball icon" />
            <h1>Pokedex</h1>
          </div>
          <div class="search-wrapper">
            <div class="search-wrap">
              <img src="./assets/icons/search.svg" alt="search-icon" />
              <input
                type="text"
                class="search-input body3-fonts"
                placeholder="Search"
                id="search-input"
              />
              <img
                src="./assets/icons/cross.svg"
                alt=" cross icon"
                class="search-close-icon"
                id="search-close-icon"
              />
            </div>
            <div class="sort-wrapper">
              <div class="sort-wrap" id="sort-button">
                <img
                  src="./assets/icons/sorting.svg"
                  alt="sorting"
                  class="sort-icon"
                  id="sort-icon"
                />
              </div>

              <div class="filter-wrapper hidden" id="filter-menu">
                <p class="body2-fonts">Sort by:</p>
                <div class="filter-wrap">
                  <div>
                    <input
                      type="radio"
                      id="number"
                      name="filters"
                      value="number"
                    />
                    <label for="number" class="body3-fonts">Number</label>
                  </div>
                  <div>
                    <input
                      type="radio"
                      id="name"
                      name="filters"
                      value="name"
                      checked
                    />
                    <label for="name" class="body3-fonts">Name</label>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div
            class="not-found-message-text hidden"
            id="not-found-message-text"
          >
            <h2>you need 3 char.</h2>
          </div>
          <div class="btn-genarations">
            <button class="gen1" onclick="changeGeneration(1)">Gen 1</button>
            <button class="gen2" onclick="changeGeneration(2)">Gen 2</button>
            <button class="gen3" onclick="changeGeneration(3)">Gen 3</button>
            <button class="gen4" onclick="changeGeneration(4)">Gen 4</button>
            <button class="gen5" onclick="changeGeneration(5)">Gen 5</button>
          </div>
        </section>
      </header>

      <section class="pokemon-list">
        <div class="container">
          <div class="list-wrapper" id="list-wrapper"></div>
          <div class="load-more-container">
            <button
              id="load-more-btn"
              class="load-more-button"
              onclick="loadMorePokemons()"
            >
              Load more
            </button>
          </div>
          <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
          <div id="loading">
            <div class="loader">
              <div class="inner one"></div>
              <div class="inner two"></div>
              <div class="inner three"></div>
            </div>
          </div>
        </div>
        <div id="not-found-message" class="hidden">Pokemon not found</div>

        <dialog id="pokemon-detail-dialog">
          <button id="close-dialog-btn">&times;</button>
          <div id="dialog-content"></div>
        </dialog>
      </section>
    </main>

    <footer class="footer">
      <section class="footer_section">
        <section class="img_section">
          <img src="./assets/icons/dalogo.svg" alt="Logo_from_DA" />
        </section>
      </section>
    </footer>
  </body>
</html>
